<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post a Gig - CampusGig</title>
</head>
<body>

    <h1>Post a Campus Gig</h1>

    <form action="post-gig" method="post">

        <label for="posterId">Poster ID:</label>
        <input type="number" id="posterId" name="posterId" required>
        <br><br>

        <label for="title">Gig Title:</label>
        <input type="text" id="title" name="title" required>
        <br><br>

        <label for="description">Description:</label>
        <textarea id="description" name="description" required></textarea>
        <br><br>

        <label for="budget">Budget:</label>
        <input type="number" id="budget" name="budget"
               step="0.01" min="0.01" required>
        <br><br>

        <label for="deadline">Deadline:</label>
        <input type="date" id="deadline" name="deadline" required>
        <br><br>

        <button type="submit">Post Gig</button>

    </form>

</body>
</html>
