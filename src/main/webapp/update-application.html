<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Application - CampusGig</title>
</head>
<body>
    <h1>Update Application Status</h1>

    <form action="update-application" method="post">

        <label for="applicationId">Application ID:</label>
        <input type="number" id="applicationId" name="applicationId" min="1" required>
        <br><br>

        <label for="status">Application Status:</label>
        <select id="status" name="status" required>
            <option value="">Select Status</option>
            <option value="HIRED">Hire</option>
            <option value="REJECTED">Reject</option>
        </select>
        <br><br>

        <button type="submit">Update Status</button>

    </form>

    <br>

    <a href="review-applications.html">Back to Review Applications</a>

</body>
</html>
