<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Apply for Gig - CampusGig</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar">

        <a href="index.html" class="logo">
            Campus<span>Gig</span>
        </a>

        <ul class="nav-links">

            <li>
                <a href="index.html">Home</a>
            </li>

            <li>
                <a href="browse-gigs.html">Browse Gigs</a>
            </li>

            <li>
                <a href="post-gig.html" class="nav-button">
                    Post a Gig
                </a>
            </li>

        </ul>

    </nav>


    <!-- Main Content -->
    <main class="container">

        <div class="page-title">

            <h1>Apply for a Gig</h1>

            <p>
                Tell the gig poster why you're the right person for the job.
            </p>

        </div>


        <div class="form-card">

            <!-- IMPORTANT: Backend connection preserved -->
            <form
                action="apply-gig"
                method="post"
                enctype="multipart/form-data"
            >

                <div class="form-group">

                    <label for="gigId">
                        Gig ID
                    </label>

                    <input
                        type="number"
                        id="gigId"
                        name="gigId"
                        min="1"
                        placeholder="Enter the gig ID"
                        required
                    >

                    <p class="form-help">
                        Enter the ID of the gig you want to apply for.
                    </p>

                </div>


                <div class="form-group">

                    <label for="applicantId">
                        Applicant ID
                    </label>

                    <input
                        type="number"
                        id="applicantId"
                        name="applicantId"
                        min="1"
                        placeholder="Enter your student ID"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="pitchText">
                        Why are you suitable for this gig?
                    </label>

                    <textarea
                        id="pitchText"
                        name="pitchText"
                        rows="6"
                        placeholder="Tell the gig poster about your skills, experience and why you would be a good fit..."
                        required
                    ></textarea>

                </div>


                <div class="form-group">

                    <label for="portfolio">
                        Portfolio / Resume
                    </label>

                    <input
                        type="file"
                        id="portfolio"
                        name="portfolio"
                    >

                    <p class="form-help">
                        Upload your resume or portfolio if required.
                    </p>

                </div>


                <div class="form-actions">

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Submit Application
                    </button>

                    <a
                        href="browse-gigs.html"
                        class="btn btn-secondary"
                    >
                        Back to Gigs
                    </a>

                </div>

            </form>

        </div>

    </main>


    <!-- Footer -->
    <footer class="footer">

        <p>
            © 2026 CampusGig. Built by students, for students.
        </p>

    </footer>

</body>
</html>
